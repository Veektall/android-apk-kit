# ROUTE B: build inside ChatGPT's workspace.
# Packs the offline toolchain (build.sh, Android build tools, android.jar, signing key) into toolchain.zip,
# proves it builds app/ offline, then publishes it as the "toolchain" artifact and the "toolchain" release.
name: Toolchain Pack
on:
  push:
    paths: ["tools/**", "build.sh", "android.jar", "keys/**", ".github/workflows/toolchain-pack.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Make toolchain.zip
        run: |
          mkdir -p dist
          zip -qr dist/toolchain.zip build.sh tools android.jar keys TOOLCHAIN.txt
          ls -la dist
      - name: Self-test (unzip in an empty folder, build app/ offline)
        run: |
          mkdir /tmp/t && cd /tmp/t && unzip -q "$GITHUB_WORKSPACE/dist/toolchain.zip"
          cp -r "$GITHUB_WORKSPACE/app" ./app
          bash build.sh app
      - uses: actions/upload-artifact@v4
        with: { name: toolchain, path: dist/toolchain.zip, retention-days: 90 }
      - name: Publish toolchain release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete toolchain -y --cleanup-tag || true
          gh release create toolchain dist/toolchain.zip --title "Offline toolchain" --notes "Unzip, put your app in app/, run: bash build.sh app"
