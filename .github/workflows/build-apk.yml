# ROUTE A: build on GitHub. Any change under app/ builds a native APK.
# Download: Releases > latest > app.apk  (also kept as the "apk" artifact on the run)
name: Build APK
on:
  push:
    paths: ["app/**", "build.sh"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Build native APK
        run: bash build.sh app
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: out/*.apk, retention-days: 7 }
      - name: Publish download link
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest out/*.apk --title "Latest APK" --notes "Native build of app/ at ${GITHUB_SHA::7}"
